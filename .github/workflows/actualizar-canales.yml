name: Actualizar canales IPTV

on:
  # Botón "Run workflow" en la app de GitHub / sitio web, desde donde quieras.
  workflow_dispatch: {}

  # Opcional: corre solo cada 5 minutos (el intervalo mínimo que permite GitHub Actions).
  # OJO: en repos PRIVADOS esto consume muy rápido los 2000 minutos gratis/mes.
  # En repos PÚBLICOS los minutos de Actions son gratis sin límite práctico.
  # Borrá estas dos líneas si no querés que se ejecute automático.
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: actualizar-canales
  cancel-in-progress: false   # deja terminar la corrida en curso; la siguiente espera en cola

permissions:
  contents: write   # necesario para que el token automático de Actions pueda pushear al repo

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright nest_asyncio PyGithub requests
          playwright install --with-deps chromium

      - name: Ejecutar script
        env:
          # Si "prueba" es ESTE mismo repo, dejá esta línea tal cual (token automático de Actions).
          # Si es OTRO repo, creá un secret propio (ej. GH_TOKEN) y reemplazá:
          # GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python iptv_unificador.py
