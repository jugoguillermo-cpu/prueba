name: Actualizador M3U Automation

on:
  schedule:
    - cron: '0 */6 * * *' # Ejecución automática cada 6 horas
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar Scraper de M3U
        env:
          PYTHONUNBUFFERED: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python iptv_unificador.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add m3u_capturados/
          git diff-index --quiet HEAD || git commit -m "Auto-update listas M3U [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
